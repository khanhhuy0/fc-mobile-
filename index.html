<style>
    @media (max-width: 768px) {
 /* CSS cho điện thoại */
}

 .main-header{

button{

}

}

body{
 font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
 font-size:14px;

}

:root{
 /* Brand */
 --brand1:#37003c;
 --brand2:#4f0058;
 --accent:#22c55e;
 --gold:#facc15;
 --danger:#ef4444;

 /* Dark theme (default) */
 --bg:#070b18;
 --bg-soft:#0b1224;
 --card:#0f172a;
 --line:#1e293b;
 --text:#e5e7eb;
 --muted:#94a3b8;

 --radius:14px;
}

*{box-sizing:border-box}
body{
 margin:0;
 font-family:Ir,Segoe UInte,sans-serif;
 background:
  radial-gradient(1200px at 20% -10%,#1e0036 0%,transparent 60%),
  radial-gradient(800px at 90% 10%,#003d2b 0%,transparent 55%),
  linear-gradient(180deg,#050816,#070b18);
 color:var(--text);
 transition:background .4s,color .3s;
}

header{
 padding:20px;
 border-bottom:1px solid var(--line);
 backdrop-filter:blur(10px);
 background:rgba(15,23,42,.6);

}
button{

}
button.danger{background:var(--danger)}
.container{max-width:1200px;margin:auto;padding:20px}
.card{
 background:linear-gradient(180deg,var(--card),var(--bg-soft));
 border:1px solid var(--line);
 border-radius:var(--radius);
 padding:18px;
 margin-bottom:22px;
 box-shadow:0 10px 30px rgba(0,0,0,.25);
 transition:.3s;
}
h3{margin-top:0}
.players{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:14px;
}
.player{
 border:1px solid var(--line);
 border-radius:12px;
 padding:12px;
 text-align:center;
 cursor:pointer;
}
.player img{
 width:64px;height:64px;
 border-radius:50%;
 border:2px solid var(--accent);
 margin-bottom:6px;
}

table{width:100%;border-collapse:collapse}
th,td{
 padding:8px;
 border-bottom:1px solid var(--line);
 text-align:center;
}
select,input{
 padding:8px;
 border-radius:8px;
 border:none;
 margin:4px;
}
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 display:none;
 align-items:center;
 justify-content:center;
}
.modal .box{

 background:var(--card);
 border-radius:16px;

}
.section{

}
.season-item{
 border:1px solid var(--line);
 border-radius:10px;
 padding:10px 12px;
 margin-bottom:8px;
 cursor:pointer;
 transition:.2s;
}
.season-item:hover{background:#0b1220}

.season-head{

 justify-content:space-between;

}

.season-detail{

}

/* Thứ hạng */

<body>
    
<div id="zoomModal" class="zoom-modal">

<header class="main-header">

 <div class="header-center">
  <h2>⚽ FC Mobile Pro League</h2>

<div class="container">

<div class="card">

<div class="card">

<input id="g1" type="number" placeholder="Bàn A">
<select id="p2"></select>

</thead>

<!-- ===== CLUB PROFILE MODAL ===== -->
<div class="modal" id="clubModal">

  <h3 id="clubName"></h3>

  <button onclick="clubModal.style.display='none'">Đóng</button>

<script>
    function toggleTheme(){
 document.body.classList.toggle("light");
 localStorage.setItem("theme",
  document.body.classList.contains("light")?"light":"dark");
}

// auto load theme
if(localStorage.getItem("theme")==="light"){
 document.body.classList.add("light");
}

const avatars={
 "Phan Đức":"md-a57ff7df167245d9bdeba8d2f997815f99.jpg",
 "Lâm Hùng":"il_1588xN.4238041533_k8li.jpg",
 "Khánh Huy":"Real-Madrid-Logo-3.png",
 "Trung Kiên":"OIP.webp"
};

let seasons=JSON.parse(localStorage.getItem("seasons"))||[];
let current=+localStorage.getItem("currentSeason")||0;

function save(){
 localStorage.setItem("seasons",JSON.stringify(seasons));
 localStorage.setItem("currentSeason",current);
}

function newSeason(init=false){
 seasons.push({
  name:"Season "+(seasons.length+1),
  players:Object.keys(avatars).map(n=>({
   name:n,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0
  })),
  matches:[]
 });
 save();
 if(!init) renderAll();
}
if(seasons.length===0) newSeason(true);

function renderAll(){
 renderSeasonSelect();
 render();
}

function renderSeasonSelect(){
 seasonSelect.innerHTML=seasons.map((s,i)=>
  `<option value="${i}">${s.name}</option>`).join("");
 seasonSelect.value=current;
}

seasonSelect.onchange=()=>{
 current=+seasonSelect.value;
 save();render();
};

function render(){
 const s=seasons[current];

 players.innerHTML=s.players.map(p=>`
 <div class="club" onclick="showClubProfile('${p.name}')">
  <img src="${avatars[p.name]}">
  <div>${p.name}</div>
 </div>`).join("");

 [p1,p2,h2h1,h2h2].forEach(sel=>{
  sel.innerHTML=s.players.map(p=>`<option>${p.name}</option>`).join("");
 });

 [allH2H1,allH2H2].forEach(sel=>{
  sel.innerHTML=seasons[0].players.map(p=>`<option>${p.name}</option>`).join("");
 });
table.innerHTML=[...s.players]
.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga))
.map((p,i)=>{
 let cls="";
 if(i<4) cls="top4";
 if(i>=s.players.length-2) cls="relegation";

 return `
 <tr class="${cls}">
  <td class="rank">${i+1}</td>
  <td>
   <div class="club">
    <img src="${avatars[p.name]}">
    ${p.name}
   </div>
  </td>
  <td>${p.mp}</td>
  <td>${p.w}</td>
  <td>${p.d}</td>
  <td>${p.l}</td>
  <td>${p.gf}</td>
  <td>${p.ga}</td>
  <td>${p.gf-p.ga}</td>
  <td class="points">${p.pts}</td>
 </tr>
 `;
}).join("");

 renderChart(s.players);
  afterRender();
}

function addMatch(){
 const s=seasons[current];
 const a=s.players.find(p=>p.name===p1.value);
 const b=s.players.find(p=>p.name===p2.value);
 const gA=+g1.value;
 const gB=+g2.value;
 if(a===b) return alert("Không thể đá với chính mình");

 [a,b].forEach(p=>p.mp++);
 a.gf+=gA;a.ga+=gB;
 b.gf+=gB;b.ga+=gA;

 if(gA>gB){a.w++;b.l++;a.pts+=3}
 else if(gA<gB){b.w++;a.l++;b.pts+=3}
 else{a.d++;b.d++;a.pts++;b.pts++}

 s.matches.push({a:a.name,b:b.name,ga:gA,gb:gB});
 save();render();
}

let chart;
function renderChart(players){

 if(chart) chart.destroy();
 chart=new Chart(goalChart,{
  type:"bar",
  data:{
   labels:players.map(p=>p.name),
   datasets:[{data:players.map(p=>p.gf)}]
  }
 });
}
/* ===== ADD: FORM CHART BY SEASON ===== */

let formChart;

// load danh sách người chơi
function loadFormPlayerSelect(){
 const sel=document.getElementById("formPlayerSelect");
 sel.innerHTML=Object.keys(avatars)
  .map(n=>`<option value="${n}">${n}</option>`)
  .join("");
}

// vẽ biểu đồ phong độ
function showFormChart(){
 const name=document.getElementById("formPlayerSelect").value;

 const labels=[];
 const points=[];

 seasons.forEach(s=>{
  const p=s.players.find(x=>x.name===name);
  if(p){
   labels.push(s.name);
   points.push(p.pts);
  }
 });

 if(formChart) formChart.destroy();

 formChart=new Chart(document.getElementById("formChart"),{
  type:"line",
  data:{
   labels,
   datasets:[{
    label:`Phong độ ${name}`,
    data:points,
    tension:0.3,
    fill:true,
    borderWidth:3,
    pointRadius:5
   }]
  },
  options:{
   plugins:{
    legend:{display:true},
    tooltip:{enabled:true}
   },
   scales:{
    y:{
     beginAtZero:true,
     ticks:{stepSize:1}
    }
   }
  }
 });
}

// hook render an toàn
const _render3 = render;
render = function(){
 _render3();
 loadFormPlayerSelect();
};
function afterRender(){
 loadFormPlayerSelect();
 loadPlayerHistorySelect();
 calcGlobalTitles();
}

/* ===== ADD: PLAYER SEASON HISTORY ===== */

// đổ danh sách người chơi
function loadPlayerHistorySelect(){
 const sel=document.getElementById("playerHistorySelect");
 sel.innerHTML=Object.keys(avatars)
  .map(n=>`<option value="${n}">${n}</option>`)
  .join("");
}

// hiển thị thống kê từng mùa
function showPlayerSeasonHistory(){
 const name=document.getElementById("playerHistorySelect").value;
 let html="";

 seasons.forEach(s=>{
  const p=s.players.find(x=>x.name===name);
  if(!p) return;

  const sorted=[...s.players]
   .sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
  const rank=sorted.findIndex(x=>x.name===name)+1;

  html+=`
  <div class="season-item" onclick="this.classList.toggle('active')">
   <div class="season-head">
    <span>🏆 ${s.name}</span>
    <span>#${rank} | ${p.pts}đ</span>
   </div>

   <div class="season-detail">
    Trận: ${p.mp} |
    Thắng: ${p.w} |
    Hòa: ${p.d} |
    Thua: ${p.l}<br>
    ⚽ BT: ${p.gf} |
    🧤 BB: ${p.ga} |
    HS: ${p.gf-p.ga}
   </div>
  </div>
  `;
 });

 document.getElementById("playerSeasonHistory").innerHTML=
  html || "Chưa có dữ liệu";
}

function calcH2H(matches,A,B,el,king){
 let s={m:0,Aw:0,Bw:0,d:0,Ag:0,Bg:0};
 matches.forEach(m=>{
  if((m.a===A&&m.b===B)||(m.a===B&&m.b===A)){
   s.m++;
   let ga=m.a===A?m.ga:m.gb;
   let gb=m.a===A?m.gb:m.ga;
   s.Ag+=ga;s.Bg+=gb;
   if(ga>gb)s.Aw++;
   else if(gb>ga)s.Bw++;
   else s.d++;
  }
 });
 let crown=king
 ?(s.Aw>s.Bw?`👑 ${A}`:s.Bw>s.Aw?`👑 ${B}`:"🤝 Cân bằng")
 :"";
 el.innerHTML=`
 <b>${A} vs ${B}</b><br>
 Trận: ${s.m}<br>
 Thắng: ${A} ${s.Aw} – ${B} ${s.Bw}<br>
 Hòa: ${s.d}<br>
 Bàn: ${s.Ag} – ${s.Bg}<br>
 <span style="color:var(--gold)">${crown}</span>
 `;
}

function showH2H(){

}

function showAllTimeH2H(){

}

function showAllTimeSummary(){
 let stats={};
 seasons.forEach(s=>s.matches.forEach(m=>{
  let k=[m.a,m.b].sort().join(" vs ");
  if(!stats[k]) stats[k]={A:m.a,B:m.b,m:0,Aw:0,Bw:0,d:0,Ag:0,Bg:0};
  let x=stats[k];
  x.m++;x.Ag+=m.ga;x.Bg+=m.gb;
  if(m.ga>m.gb)x.Aw++;
  else if(m.ga<m.gb)x.Bw++;
  else x.d++;
 }));
 allH2HResult.innerHTML=
 Object.values(stats).map(s=>{
  let k=s.Aw>s.Bw?`👑 ${s.A}`:s.Bw>s.Aw?`👑 ${s.B}`:"🤝";
  return`
  <div style="border-bottom:1px solid var(--line);padding:10px 0">
   <b>${s.A} vs ${s.B}</b><br>
   Trận: ${s.m} | Bàn: ${s.Ag}-${s.Bg}<br>
   ${k}
  </div>`;
 }).join("")||"Chưa có dữ liệu";
}

/* ===== ADD: GLOBAL TITLES ===== */
function calcGlobalTitles(){
 let stats={};
 seasons.forEach(s=>{
  let sorted=[...s.players]
   .sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
  sorted.forEach((p,i)=>{
   if(!stats[p.name])
    stats[p.name]={cup:0,s2:0,s3:0,last:0,gf:0,ga:0};
   stats[p.name].gf+=p.gf;
   stats[p.name].ga+=p.ga;
   if(i===0)stats[p.name].cup++;
   if(i===1)stats[p.name].s2++;
   if(i===2)stats[p.name].s3++;
   if(i===sorted.length-1)stats[p.name].last++;
  });
 });
 let arr=Object.entries(stats);
 if(arr.length===0)return;
 const max=k=>arr.sort((a,b)=>b[1][k]-a[1][k])[0];
 let cupList = arr
 .map(([name,v])=>`- ${name}: ${v.cup} 🏆`)
 .join("<br>");
 globalTitles.innerHTML=`
 👑 Vua phá lưới: ${arr.sort((a,b)=>b[1].gf-a[1].gf)[0][0]}<br>
 🏆 Vua vô địch: ${max("cup")[0]} (${max("cup")[1].cup})<br>
 🥈 Vua về nhì: ${max("s2")[0]}<br>
 🥉 Vua về ba: ${max("s3")[0]}<br>
 💀 Vua bét bảng: ${max("last")[0]}<br>
 🧤 Thủng lưới ít nhất: ${arr.sort((a,b)=>a[1].ga-b[1].ga)[0][0]}<br>
 🕳️ Thủng lưới nhiều nhất: ${arr.sort((a,b)=>b[1].ga-a[1].ga)[0][0]}
 <hr style="border:1px dashed var(--line);margin:8px 0">
 <b>📊 Số lần vô địch toàn giải:</b><br>
 ${cupList}
`;

}

function showClubProfile(name){
 let total={
  seasons:0,cup:0,second:0,last:0,
  gf:0,ga:0,pts:0
 };

 seasons.forEach(s=>{
  const p=s.players.find(x=>x.name===name);
  if(!p) return;

  total.seasons++;
  total.gf+=p.gf;
  total.ga+=p.ga;
  total.pts+=p.pts;

  const sorted=[...s.players]
   .sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
  const rank=sorted.findIndex(x=>x.name===name);

  if(rank===0) total.cup++;
  if(rank===1) total.second++;
  if(rank===sorted.length-1) total.last++;
 });

 clubName.innerHTML=`
 <img src="${avatars[name]}" style="width:36px;border-radius:50%;vertical-align:middle">
 ${name}
 `;

 clubInfo.innerHTML=`
 <b>📊 Thành tích toàn giải</b><br>
 🏆 Vô địch: ${total.cup}<br>
 🥈 Về nhì: ${total.second}<br>
 💀 Bét bảng: ${total.last}<br>
 <hr style="border:1px solid var(--line)">
 ⚽ Tổng bàn thắng: ${total.gf}<br>
 🧤 Tổng bàn thua: ${total.ga}<br>
 🎯 Tổng điểm: ${total.pts}<br>
 📅 Số mùa tham gia: ${total.seasons}<br>
 📈 Điểm TB/mùa: ${(total.pts/Math.max(1,total.seasons)).toFixed(1)}
 `;

 clubModal.style.display="flex";
}
